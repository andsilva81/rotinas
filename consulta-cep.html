<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de CEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7;
    --surface:#FFFFFF;
    --ink:#1B2238;
    --muted:#6A7185;
    --line:#E9E5DC;
    --accent:#F2B705;
    --accent-ink:#8A6A00;
    --ok:#2E9E6B;
    --danger:#C6493B;
    --shadow:0 24px 60px -20px rgba(27,34,56,.28);
    --radius:18px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(242,183,5,.10), transparent 60%),
      radial-gradient(900px 500px at 5% 110%, rgba(27,34,56,.06), transparent 55%),
      var(--paper);
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:460px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:38px 34px 32px;
  }

  .stamp{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--accent-ink);
    background:rgba(242,183,5,.14);
    border:1px solid rgba(242,183,5,.35);
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:20px;
  }
  .stamp svg{width:15px;height:15px}

  h1{
    font-family:'Sora',sans-serif;
    font-size:27px;
    font-weight:700;
    line-height:1.15;
    letter-spacing:-.01em;
    margin-bottom:8px;
  }
  .sub{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.5;
    margin-bottom:26px;
  }

  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:8px;
  }

  .field{
    display:flex;
    gap:10px;
    align-items:stretch;
  }

  input[type="text"]{
    flex:1;
    font-family:'JetBrains Mono',monospace;
    font-size:19px;
    font-weight:500;
    letter-spacing:.04em;
    color:var(--ink);
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    width:100%;
    transition:border-color .16s ease, box-shadow .16s ease;
  }
  input[type="text"]::placeholder{color:#B9BAC3;font-weight:400}
  input[type="text"]:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(242,183,5,.18);
  }

  button.search{
    font-family:'Sora',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    background:var(--accent);
    border:none;
    border-radius:12px;
    padding:0 22px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .12s ease, filter .16s ease;
    white-space:nowrap;
  }
  button.search:hover{filter:brightness(1.04)}
  button.search:active{transform:translateY(1px)}
  button.search:disabled{opacity:.6;cursor:progress}
  button.search svg{width:17px;height:17px}

  .hint{
    margin-top:12px;
    min-height:18px;
    font-size:13px;
    color:var(--danger);
    font-weight:500;
  }

  .spinner{
    width:16px;height:16px;
    border:2px solid rgba(27,34,56,.25);
    border-top-color:var(--ink);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Popup ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,25,42,.5);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:50;
  }
  .overlay.open{opacity:1;pointer-events:auto}

  .modal{
    width:100%;
    max-width:440px;
    background:var(--surface);
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transform:translateY(12px) scale(.98);
    transition:transform .22s cubic-bezier(.2,.8,.2,1);
  }
  .overlay.open .modal{transform:translateY(0) scale(1)}

  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 22px;
    background:var(--ink);
    color:#fff;
  }
  .modal-head .cep-big{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    font-weight:500;
    letter-spacing:.06em;
  }
  .modal-head .tag{
    font-size:11.5px;
    color:rgba(255,255,255,.6);
    margin-top:2px;
  }
  .close{
    background:rgba(255,255,255,.1);
    border:none;
    color:#fff;
    width:34px;height:34px;
    border-radius:9px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .close:hover{background:rgba(255,255,255,.2)}
  .close svg{width:16px;height:16px}

  .modal-body{padding:22px}

  .rows{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
  .row{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none}
  .row .k{
    font-size:12.5px;
    color:var(--muted);
    font-weight:500;
    flex-shrink:0;
  }
  .row .v{
    font-size:14.5px;
    font-weight:500;
    text-align:right;
    color:var(--ink);
  }
  .row .v.empty{color:#B9BAC3;font-weight:400;font-style:italic}

  .full{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .full .k{
    font-size:11.5px;
    color:var(--muted);
    font-weight:600;
    margin-bottom:6px;
  }
  .full .addr{
    font-size:14px;
    line-height:1.5;
    color:var(--ink);
  }

  button.copy{
    width:100%;
    font-family:'Sora',sans-serif;
    font-size:14.5px;
    font-weight:600;
    color:#fff;
    background:var(--ink);
    border:none;
    border-radius:12px;
    padding:14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:background .18s ease, transform .12s ease;
  }
  button.copy:hover{background:#262e49}
  button.copy:active{transform:translateY(1px)}
  button.copy.done{background:var(--ok)}
  button.copy svg{width:17px;height:17px}

  @media (max-width:420px){
    .card{padding:30px 22px 26px}
    .field{flex-direction:column}
    button.search{padding:14px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

  <main class="card">
    <span class="stamp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 8h16M9 4v4"/></svg>
      Correios · ViaCEP
    </span>
    <h1>Consulta de CEP</h1>
    <p class="sub">Digite um CEP para encontrar o endereço completo. O resultado abre numa janela com opção de copiar.</p>

    <label for="cep">CEP</label>
    <div class="field">
      <input id="cep" type="text" inputmode="numeric" autocomplete="off"
             maxlength="9" placeholder="00000-000" aria-describedby="hint">
      <button class="search" id="btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Buscar
      </button>
    </div>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
  </main>

  <!-- Popup -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalCep">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="cep-big" id="modalCep"></div>
          <div class="tag" id="modalTag">Endereço encontrado</div>
        </div>
        <button class="close" id="close" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="rows" id="rows"></div>
        <div class="full">
          <div class="k">Endereço completo</div>
          <div class="addr" id="fullAddr"></div>
        </div>
        <button class="copy" id="copy">
          <svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span id="copyText">Copiar endereço</span>
        </button>
      </div>
    </div>
  </div>

<script>
  const input   = document.getElementById('cep');
  const btn      = document.getElementById('btn');
  const hint     = document.getElementById('hint');
  const overlay  = document.getElementById('overlay');
  const closeBtn = document.getElementById('close');
  const rows     = document.getElementById('rows');
  const fullAddr = document.getElementById('fullAddr');
  const copyBtn  = document.getElementById('copy');
  const copyText = document.getElementById('copyText');
  const copyIcon = document.getElementById('copyIcon');

  let fullAddressString = '';

  // Máscara 00000-000
  input.addEventListener('input', () => {
    let v = input.value.replace(/\D/g, '').slice(0, 8);
    if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5);
    input.value = v;
    hint.textContent = '';
    hint.style.color = 'var(--danger)';
  });

  input.addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
  btn.addEventListener('click', buscar);

  function setLoading(on) {
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span> Buscando'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg> Buscar';
  }

  async function buscar() {
    const cep = input.value.replace(/\D/g, '');
    hint.style.color = 'var(--danger)';

    if (cep.length !== 8) {
      hint.textContent = 'Informe um CEP com 8 dígitos.';
      input.focus();
      return;
    }

    setLoading(true);
    hint.textContent = '';

    try {
      const resp = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      if (!resp.ok) throw new Error('rede');
      const data = await resp.json();

      if (data.erro) {
        hint.textContent = 'CEP não encontrado. Verifique e tente novamente.';
        return;
      }
      mostrarResultado(data);
    } catch (err) {
      hint.textContent = 'Não foi possível consultar agora. Verifique sua conexão.';
    } finally {
      setLoading(false);
    }
  }

  function mostrarResultado(d) {
    const val = v => v && v.trim() ? v : null;

    const dados = [
      ['Logradouro',  val(d.logradouro)],
      ['Complemento', val(d.complemento)],
      ['Bairro',      val(d.bairro)],
      ['Cidade',      val(d.localidade)],
      ['Estado',      val(d.uf)],
      ['DDD',         val(d.ddd)],
    ];

    rows.innerHTML = dados.map(([k, v]) => `
      <div class="row">
        <span class="k">${k}</span>
        <span class="v ${v ? '' : 'empty'}">${v || '—'}</span>
      </div>`).join('');

    // Monta o endereço completo, ignorando campos vazios
    const linha1 = [val(d.logradouro), val(d.complemento), val(d.bairro)]
      .filter(Boolean).join(', ');
    const linha2 = [
      [val(d.localidade), val(d.uf)].filter(Boolean).join(' - '),
      `CEP ${d.cep}`
    ].filter(Boolean).join(', ');

    fullAddressString = [linha1, linha2].filter(Boolean).join('\n');
    fullAddr.innerHTML = fullAddressString.replace(/\n/g, '<br>');

    document.getElementById('modalCep').textContent = d.cep;
    resetCopy();
    abrir();
  }

  function abrir() {
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }
  function fechar() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    input.focus();
  }

  closeBtn.addEventListener('click', fechar);
  overlay.addEventListener('click', e => { if (e.target === overlay) fechar(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) fechar();
  });

  function resetCopy() {
    copyBtn.classList.remove('done');
    copyText.textContent = 'Copiar endereço';
    copyIcon.innerHTML = '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>';
  }

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(fullAddressString);
    } catch {
      // Fallback para navegadores sem clipboard API
      const ta = document.createElement('textarea');
      ta.value = fullAddressString;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    copyBtn.classList.add('done');
    copyText.textContent = 'Copiado!';
    copyIcon.innerHTML = '<path d="M20 6 9 17l-5-5"/>';
    setTimeout(resetCopy, 1800);
  });

  input.focus();
</script>
</body>
</html>
